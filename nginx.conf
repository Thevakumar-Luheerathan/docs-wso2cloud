worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable paths for a non-root user. The pid file is set on the command line.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # HTML must revalidate so new deploys are picked up; keyed on the response
    # type so it also covers pages resolved via try_files and the 404 page.
    map $sent_http_content_type $html_cache_control {
        ~^text/html "no-cache";
        default     "";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects stay relative so they keep the host and scheme the gateway received.
        absolute_redirect off;

        # Docusaurus emits a real HTML file per route, so no SPA fallback.
        # $uri/index.html rather than $uri/ so a directory without an index
        # (for example /docs/) returns 404 instead of 403.
        error_page 404 /404.html;

        location / {
            add_header Cache-Control $html_cache_control always;
            try_files $uri $uri/index.html $uri.html =404;
        }

        # Machine-readable docs for AI agents (plugins/llms-txt.ts). mime.types
        # has no entry for .md, so default_type supplies it. Not content-hashed,
        # so they revalidate like HTML.
        location ~ \.(md|txt)$ {
            default_type text/markdown;
            charset utf-8;
            charset_types text/plain text/markdown;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Content-hashed bundles are safe to cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
